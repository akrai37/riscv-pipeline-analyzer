name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [release, sanitize]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config == 'release' && 'Release' || 'Debug' }}
          -DRVSIM_WERROR=ON
          -DRVSIM_SANITIZE=${{ matrix.config == 'sanitize' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

      # ctest already runs 300 fuzz seeds; CI runs many more, and the
      # sanitizer build checks the simulator's own memory safety on them.
      - name: Fuzz
        run: ./build/rvsim-fuzz --seeds ${{ matrix.config == 'release' && '50000' || '5000' }}

      # The simulator is deterministic and the programs are committed, so the
      # published results must regenerate byte for byte.
      - name: Results are reproducible
        if: matrix.config == 'release'
        run: |
          python3 scripts/run_experiments.py --rvsim build/rvsim --out fresh-results
          diff -r results fresh-results

  # The tests above run the committed prebuilt programs. This job rebuilds
  # them from source with Ubuntu's clang, a different compiler version from
  # the one that produced the committed binaries, and runs the result, so
  # the sources and the runtime cannot drift from the binaries unnoticed.
  rebuilt-programs:
    name: rebuilt programs / ubuntu clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V capable clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build programs
        run: make -C workloads OUT="$PWD/out" -j

      - name: Build simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRVSIM_BUILD_TESTS=OFF
          cmake --build build -j

      - name: Run programs
        run: |
          count=0
          for f in out/workloads/*.elf out/riscv-tests/*.elf; do
            ./build/rvsim -q "$f" > /dev/null || { echo "FAILED: $f"; exit 1; }
            count=$((count + 1))
          done
          echo "$count programs passed"
          test "$count" -eq 55
